version: 2
updates:
  # GitHub Actions used in this repo.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  # Node.js dependencies.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      # Group minor and patch updates so we don't drown in PRs.
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
